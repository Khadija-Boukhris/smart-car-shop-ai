services:
  springboot-app:
    image: springboot-app
    restart: always
    build: .
    ports:
      - "9090:8082"
    environment:
      MYSQL_HOST: mariadb
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_PORT: 3306
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
    depends_on:
      mariadb:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    container_name: smart-car-shop-frontend
    build: ./src/main/webapp/reactjs
    ports:
      - "3000:80"
    depends_on:
      - springboot-app

  mariadb:
    container_name: mariadb
    image: mariadb
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: miola
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    container_name: ollama
    hostname: ollama
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  ollama_data: